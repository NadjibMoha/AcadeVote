version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: acadevote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hardhat:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"

  backend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/acadevote
      - JWT_SECRET=supersecret123
      - SERVER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - HARDHAT_RPC_URL=http://hardhat:8545
      - CLIENT_URL=http://localhost:5173
    command: sh -c "apt-get update && apt-get install -y netcat-traditional && npm install && cd server && npm install && cd .. && chmod +x scripts/docker-entrypoint.sh && ./scripts/docker-entrypoint.sh"
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - hardhat

  frontend:
    image: node:20-slim
    working_dir: /app/client
    volumes:
      - .:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:3001/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
